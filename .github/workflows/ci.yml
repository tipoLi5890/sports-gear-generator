name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Finite values, valid indices, outward winding, 7 colourways and a material for every part.
      - name: Geometry checks
        run: npm run check

      # index.html is a build artefact; it must match what src/ produces.
      - name: index.html is up to date
        run: |
          npm run build
          git diff --exit-code -- index.html || { echo "::error::index.html is stale. Run npm run build and commit it."; exit 1; }
